<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TimeLock Student</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
:root{--on:#1b1030;--bg:#0e1230;--bg2:#1b1650;--fg:#f4f6ff;--card:rgba(255,255,255,.07);--mut:#9ba3cf;--a:#ff9f43;--b:#ff5e7e;--c:#2de0a5;--bd:rgba(255,255,255,.1);--g:linear-gradient(135deg,var(--a),var(--b))}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden}
body{font-family:Sora,system-ui,sans-serif;background:linear-gradient(160deg,var(--bg),var(--bg2)) fixed;color:var(--fg);display:flex;justify-content:center}
.bl{position:fixed;border-radius:50%;filter:blur(70px);opacity:.35;animation:fl 12s ease-in-out infinite alternate;pointer-events:none}
@keyframes fl{to{transform:translate(40px,60px) scale(1.2)}}
#app{position:relative;width:100%;max-width:480px;height:100%;display:flex;flex-direction:column}
header{display:flex;justify-content:space-between;align-items:center;padding:calc(14px + env(safe-area-inset-top,0px)) 20px 8px}
.hi{display:flex;gap:12px;align-items:center}
#v{flex:1;overflow-y:auto;padding:8px 20px 120px;scrollbar-width:none}
#v>*{animation:up .5s cubic-bezier(.2,.8,.2,1) both}
#v>*:nth-child(2){animation-delay:.07s}#v>*:nth-child(3){animation-delay:.14s}#v>*:nth-child(4){animation-delay:.21s}#v>*:nth-child(n+5){animation-delay:.28s}
@keyframes up{from{opacity:0;transform:translateY(18px)}}
h1,h2,h3{margin:0}h1{font-size:26px;font-weight:800;letter-spacing:-.5px}h2{font-size:17px;font-weight:700;line-height:1.35}h3{font-size:13px;color:var(--mut);text-transform:uppercase;letter-spacing:1px;margin:18px 0 8px}
.s{color:var(--mut);font-size:13px;line-height:1.5}.num{font-family:"Space Grotesk",sans-serif;font-weight:700}
.card{background:var(--card);border:1px solid var(--bd);border-radius:24px;padding:18px;margin-bottom:16px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 12px 30px rgba(0,0,0,.18)}
.pill{display:flex;gap:6px;align-items:center;background:var(--g);color:var(--on);border-radius:99px;padding:8px 14px;font:700 15px "Space Grotesk",sans-serif;animation:pop .6s both}
@keyframes pop{from{transform:scale(.6);opacity:0}}
.ic{flex:none}
button{font:inherit;cursor:pointer;border:0;color:inherit}
button:active{transform:scale(.96)}
.pri{width:100%;padding:15px;border-radius:18px;background:var(--g);color:var(--on);font-weight:800;font-size:16px;margin-top:10px;box-shadow:0 10px 24px color-mix(in srgb,var(--a) 40%,transparent);transition:transform .15s}
.gh{width:100%;padding:14px;border-radius:18px;background:transparent;border:1px solid var(--bd);font-weight:600;margin-top:10px}
.f{display:block;margin-bottom:12px;flex:1;min-width:0}.f span{display:block;font-size:12px;font-weight:600;color:var(--mut);margin:0 0 6px 4px}
.inp{display:flex;align-items:center;gap:10px;padding:0 14px;background:rgba(127,127,160,.12);border:1px solid var(--bd);border-radius:16px;color:var(--mut);transition:.2s}
.inp:focus-within{border-color:var(--a);box-shadow:0 0 0 3px color-mix(in srgb,var(--a) 25%,transparent)}
input,select,textarea{width:100%;padding:14px 0;background:transparent;border:0;outline:0;color:var(--fg);font:inherit;font-size:15px}
select option{color:#222}textarea{resize:none;height:70px}
.two{display:flex;gap:10px}.err{color:var(--b);font-size:13px;min-height:18px}
.auth{padding-top:30px;padding-bottom:40px}.auth .hero{margin:14px 0 4px}
.logo{width:64px;height:64px;border-radius:22px;background:var(--g);color:var(--on);display:grid;place-items:center;animation:pop .7s both;box-shadow:0 14px 34px color-mix(in srgb,var(--b) 45%,transparent)}
.seg{display:flex;background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:5px;margin:18px 0}
.seg button,.seg2 button{flex:1;padding:11px;border-radius:14px;background:transparent;font-weight:700;color:var(--mut);transition:.25s}
.seg button.on,.seg2 button.on{background:var(--g);color:var(--on)}
.seg2{display:flex;background:var(--card);border-radius:16px;padding:4px;margin-bottom:16px}
nav{position:absolute;left:16px;right:16px;bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;padding:8px;border-radius:30px;background:color-mix(in srgb,var(--bg) 70%,transparent);border:1px solid var(--bd);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);box-shadow:0 14px 40px rgba(0,0,0,.35);animation:up .6s both}
nav button{flex:1;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--mut);padding:2px}
.ib{width:48px;height:34px;border-radius:14px;display:grid;place-items:center;transition:.3s}
nav button.on{color:var(--fg)}nav button.on .ib{background:var(--g);color:var(--on);animation:pop .4s both}
.hc{background:var(--g);color:var(--on);border-radius:28px;padding:22px;display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;position:relative;overflow:hidden;box-shadow:0 18px 40px color-mix(in srgb,var(--b) 35%,transparent)}
.hc::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.35) 50%,transparent 70%);transform:translateX(-100%);animation:sh 3.5s ease-in-out infinite}
@keyframes sh{60%,100%{transform:translateX(100%)}}
.hc .big{font:800 40px "Space Grotesk",sans-serif;line-height:1}.hc .s{color:rgba(27,16,48,.7)}
.rg{animation:rg 1.2s .2s cubic-bezier(.2,.8,.2,1) both}@keyframes rg{from{stroke-dashoffset:214}}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.tile{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:14px 10px;text-align:center}
.tile b{display:block;font:700 20px "Space Grotesk",sans-serif;margin-top:4px}.tile .s{font-size:11px}
.fire{color:var(--a);animation:pulse 1.4s infinite}@keyframes pulse{50%{transform:scale(1.18)}}
.qn{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.qb{width:30px;height:30px;border-radius:10px;background:var(--g);color:var(--on);display:grid;place-items:center;font:800 14px "Space Grotesk"}
.opt{width:100%;display:flex;align-items:center;gap:12px;text-align:left;padding:13px 14px;margin-top:9px;border-radius:16px;background:rgba(127,127,160,.12);border:1px solid var(--bd);font-weight:600;font-size:15px;transition:.2s}
.opt i{width:26px;height:26px;border-radius:9px;background:var(--card);display:grid;place-items:center;font:700 12px "Space Grotesk";font-style:normal;flex:none}
.opt.ok{background:var(--c);color:var(--on);border-color:var(--c);animation:pop .4s}.opt.no{background:var(--b);color:var(--on);border-color:var(--b);animation:shk .4s}
@keyframes shk{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.cf{position:fixed;width:9px;height:9px;border-radius:3px;pointer-events:none;z-index:99;animation:cf .9s ease-out forwards}
@keyframes cf{to{transform:translate(var(--x),var(--y)) rotate(540deg);opacity:0}}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.pt{border-radius:26px;padding:18px;min-height:170px;color:var(--on);display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 14px 30px rgba(0,0,0,.25);transition:transform .2s}
.pt:active{transform:scale(.96)}.pt b{font-size:15px;line-height:1.3}.pt small{opacity:.75;font-size:12px}
.pt .ib{width:46px;height:46px;border-radius:16px;background:rgba(255,255,255,.35)}
.lk{text-align:center;padding:30px 18px}.lk .ib{width:76px;height:76px;border-radius:26px;background:var(--g);color:var(--on);margin:0 auto 14px;animation:pulse 2s infinite}
.cd{font:700 38px "Space Grotesk",monospace;margin:10px 0}
.pod{display:flex;align-items:flex-end;justify-content:center;gap:10px;margin:10px 0 20px}
.pd{flex:1;text-align:center}.pd .bar{border-radius:20px 20px 8px 8px;margin-top:8px;display:flex;align-items:flex-start;justify-content:center;padding-top:10px;font:800 22px "Space Grotesk";color:var(--on);animation:grow .8s cubic-bezier(.2,.8,.2,1) both;transform-origin:bottom}
@keyframes grow{from{transform:scaleY(0)}}
.av{border-radius:50%;background:var(--g);color:var(--on);display:grid;place-items:center;font-weight:800;overflow:hidden;flex:none;margin:0 auto}.av img{width:100%;height:100%;object-fit:cover}
.row{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:18px;margin-bottom:8px;background:var(--card);border:1px solid var(--bd)}
.row.me{border-color:var(--a);background:color-mix(in srgb,var(--a) 14%,transparent)}.row .r{width:26px;font:700 15px "Space Grotesk";color:var(--mut);text-align:center}
.rw{position:relative;width:118px;height:118px;margin:6px auto 0;display:grid;place-items:center}
.rw::before{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(var(--a),var(--b),var(--c),var(--a));animation:spin 6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.rw .av{position:relative;border:5px solid var(--bg)}
.plus{position:absolute;right:2px;bottom:2px;width:34px;height:34px;border-radius:50%;background:var(--g);color:var(--on);display:grid;place-items:center;border:3px solid var(--bg);z-index:2}
.st{display:flex;justify-content:center;margin:16px 0}.st div{padding:0 22px;text-align:center}.st div+div{border-left:1px solid var(--bd)}
.st b{display:block;font:700 22px "Space Grotesk"}
.acts{display:flex;gap:8px;justify-content:center}.acts .gh{width:auto;margin:0;padding:12px 26px}.acts .sq{width:46px;padding:0;display:grid;place-items:center}
.tabs{display:flex;border-bottom:1px solid var(--bd);margin:18px 0 14px}
.tabs button{flex:1;background:none;padding:12px;color:var(--mut);display:grid;place-items:center;border-bottom:3px solid transparent;transition:.25s}
.tabs button.on{color:var(--fg);border-color:var(--a)}
.bg3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.bd{aspect-ratio:1;border-radius:18px;background:var(--g);color:var(--on);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:11px;font-weight:700;text-align:center;padding:6px;animation:pop .5s both}
.bd.off{background:var(--card);color:var(--mut);border:1px dashed var(--bd);opacity:.6}
.ir{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--bd)}.ir:last-child{border:0}.ir .s{font-size:11px}.ir b{font-size:14px;word-break:break-word}
.sw{border-radius:20px;padding:14px;border:2px solid transparent;text-align:left;min-height:84px;animation:pop .5s both}.sw.on{border-color:var(--fg)}
.dots{display:flex;gap:5px;margin-bottom:10px}.dots i{width:16px;height:16px;border-radius:50%}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;z-index:50;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.sh{width:100%;max-width:480px;background:var(--bg2);border-radius:30px 30px 0 0;padding:14px 22px calc(26px + env(safe-area-inset-bottom,0px));animation:sl .35s cubic-bezier(.2,.8,.2,1)}
@keyframes sl{from{transform:translateY(100%)}}.sh h3{margin:6px 0 14px;color:var(--fg);font-size:18px;text-transform:none;letter-spacing:0}
.grab{width:44px;height:5px;border-radius:9px;background:var(--bd);margin:0 auto 8px}
.mb{max-width:86%;padding:12px 15px;border-radius:20px;margin-bottom:10px;font-size:14px;line-height:1.5;animation:pop .35s both;word-wrap:break-word}
.mb.b{background:var(--card);border:1px solid var(--bd);border-bottom-left-radius:6px}
.mb.u{background:var(--g);color:var(--on);margin-left:auto;border-bottom-right-radius:6px;font-weight:600}
.cin{position:sticky;bottom:94px;padding-top:14px;background:linear-gradient(transparent,var(--bg2) 28%)}
.chips{display:flex;gap:8px;overflow-x:auto;margin-bottom:8px;scrollbar-width:none}.chips button{flex:none;padding:8px 14px;border-radius:99px;background:var(--card);border:1px solid var(--bd);font-size:12px;font-weight:600}
.cin .inp{padding-right:6px;background:var(--bg2)}.sd{width:40px;height:40px;border-radius:14px;background:var(--g);color:var(--on);display:grid;place-items:center;flex:none}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important}}
</style>
</head>
